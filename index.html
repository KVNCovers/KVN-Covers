<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="KVN Covers"><meta property="og:description" content="Your style, our cover."><meta property="og:image" content="logo.jpg">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>:root{--bg:#04050a;--bg2:#0a0d18;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--ink:#f3f6ff;--mut:#9aa6c2;--g1:#1d6fff;--g2:#38d0ff;--g3:#7c5cff;--grad:linear-gradient(135deg,var(--g1),var(--g2));--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--sh:0 20px 60px -20px rgba(29,111,255,.6);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[dir=rtl]{--sd:-1}[dir=ltr]{--sd:1}
html{scroll-behavior:smooth;scroll-padding-top:96px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif;line-height:1.6;overflow-x:hidden}body.lock{overflow:hidden}
button,input,select{font-family:inherit;font-size:1rem;color:inherit}a{color:inherit}
.lat{font-family:'Outfit','Cairo',sans-serif}.mut{color:var(--mut)}
#pg{position:fixed;top:0;inset-inline:0;height:3px;width:0;background:var(--grad);z-index:90;box-shadow:0 0 12px var(--g2)}
.aur{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aur i{position:absolute;border-radius:50%;filter:blur(120px);opacity:.38;animation:drift 20s ease-in-out infinite alternate}
.aur i:nth-child(1){width:520px;height:520px;background:var(--g1);top:-160px;inset-inline-end:-120px}
.aur i:nth-child(2){width:460px;height:460px;background:var(--g3);top:40%;inset-inline-start:-180px;animation-delay:-6s}
.aur i:nth-child(3){width:420px;height:420px;background:var(--g2);bottom:-160px;inset-inline-end:10%;animation-delay:-12s}
.aur:after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;-webkit-mask:radial-gradient(ellipse at 50% 0,#000,transparent 72%);mask:radial-gradient(ellipse at 50% 0,#000,transparent 72%);opacity:.55}
@keyframes drift{to{transform:translate(60px,50px) scale(1.15)}}
.ann{direction:ltr;overflow:hidden;background:var(--grad);color:#fff;padding:7px 0;font-size:.86rem;font-weight:700}
.ann div{display:flex;gap:70px;width:max-content;animation:mqL 40s linear infinite}
@keyframes mqL{to{transform:translateX(-50%)}}@keyframes mqR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.nav{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;margin:12px 4% 0;padding:10px 18px;border-radius:999px;background:rgba(8,11,20,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;transition:.35s}
.nav.sc{margin-inline:7%;padding:7px 16px;box-shadow:var(--sh);background:rgba(6,8,16,.82)}
a.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;text-decoration:none}
a.logo img{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);transition:.4s}a.logo:hover img{transform:rotate(-12deg) scale(1.1)}
a.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:6px}.links a{text-decoration:none;color:var(--mut);font-weight:700;padding:7px 15px;border-radius:999px;transition:.25s}.links a:hover{color:var(--ink);background:var(--card)}.links a.on{color:#fff;background:rgba(29,111,255,.28)}
.acts2{display:flex;gap:8px;align-items:center}
.langb{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:800;transition:.25s}.langb:hover{border-color:var(--g2)}
.burger{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;cursor:pointer;font-size:1.2rem}
.mmenu{display:none}
.btn{position:relative;overflow:hidden;background:var(--grad);color:#fff;border:0;padding:11px 22px;border-radius:999px;cursor:pointer;font-weight:800;transition:.3s;box-shadow:0 8px 24px -10px var(--g1);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:before{content:"";position:absolute;top:0;bottom:0;width:60%;inset-inline-start:-80%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:.7s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px -10px var(--g1)}.btn:hover:before{inset-inline-start:130%}
.btn.o{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ink)}.btn.o:hover{border-color:var(--g2);background:var(--card)}
.btn.big{padding:15px 32px;font-size:1.05rem}.btn.sm{padding:7px 14px;font-size:.85rem}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}.btn:disabled:before{display:none}
.cnt{background:var(--bad);color:#fff;border-radius:999px;min-width:21px;height:21px;padding:0 6px;font-size:.74rem;display:inline-grid;place-items:center}
.cartb.bump{animation:bump .5s}@keyframes bump{30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(.95)}}
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:70px 6% 40px;max-width:1280px;margin:auto}
.pill{display:inline-flex;align-items:center;gap:9px;padding:6px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);backdrop-filter:blur(8px);font-size:.86rem;color:var(--mut);margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 1.8s infinite}@keyframes ping{70%{box-shadow:0 0 0 10px transparent}}
.hero h1{font-size:clamp(2.4rem,6.2vw,4.8rem);font-weight:900;line-height:1.12;letter-spacing:-.5px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--g2),var(--g1),var(--g3),var(--g2));background-size:300% 100%;animation:gs 6s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent}@keyframes gs{to{background-position:300% 0}}
.hp{color:var(--mut);margin:18px 0 28px;max-width:500px;font-size:1.08rem}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:34px;margin-top:38px;flex-wrap:wrap}.stats div{display:flex;flex-direction:column}.stats b{font-family:'Outfit',sans-serif;font-size:2rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}.stats span{color:var(--mut);font-size:.85rem}
.hv{position:relative;display:grid;place-items:center;min-height:430px}
.heroLogo{width:min(340px,70vw);border-radius:50%;position:relative;z-index:2;box-shadow:0 0 110px -10px var(--g1);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px)}}
.ring{position:absolute;width:min(430px,86vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,var(--g1),var(--g2),var(--g3),var(--g1));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 14s linear infinite;opacity:.8}
.ring.r2{width:min(500px,98vw);animation-duration:22s;animation-direction:reverse;opacity:.35}@keyframes spin{to{transform:rotate(360deg)}}
.orb{position:absolute;z-index:3;padding:8px 18px;border-radius:999px;background:rgba(10,13,24,.75);backdrop-filter:blur(10px);border:1px solid var(--line);font-weight:800;font-family:'Outfit',sans-serif;box-shadow:var(--sh);animation:fl 5s ease-in-out infinite}
.orb.o1{top:8%;inset-inline-start:2%}.orb.o2{bottom:14%;inset-inline-end:0;animation-delay:-1.6s}.orb.o3{top:46%;inset-inline-start:-4%;animation-delay:-3s}
.mqw{direction:ltr;overflow:hidden;padding:26px 0;border-block:1px solid var(--line);background:rgba(255,255,255,.015);margin-top:30px}
.mqw div{display:flex;gap:56px;width:max-content;animation:mqL 34s linear infinite}.mqw span{font:800 clamp(2rem,5.5vw,3.6rem) 'Outfit',sans-serif;-webkit-text-stroke:1px rgba(255,255,255,.28);color:transparent;white-space:nowrap}.mqw span.f{-webkit-text-stroke:0;color:var(--g2)}
.sec{max-width:1280px;margin:auto;padding:80px 5% 10px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.sec h2{font-size:clamp(1.8rem,4.4vw,2.8rem);font-weight:900;line-height:1.2}.sec h2 em{font-style:normal;color:var(--g2)}
.eyebrow{color:var(--g2);font-weight:800;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-family:'Outfit',sans-serif}
.rv{opacity:0;translate:0 34px;transition:opacity .9s cubic-bezier(.2,.7,.2,1),translate .9s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;translate:0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:26px}
.tile{position:relative;overflow:hidden;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px 26px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;transition:.4s}
.tile:before,.card:before,.step:before{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(56,208,255,.16),transparent 62%);opacity:0;transition:.3s;pointer-events:none}
.tile:hover:before,.card:hover:before,.step:hover:before{opacity:1}.tile:hover{border-color:rgba(56,208,255,.5);transform:translateY(-6px);box-shadow:var(--sh)}
.tile i{position:absolute;top:-18px;inset-inline-end:14px;font:900 7.5rem/1 'Outfit',sans-serif;font-style:normal;color:rgba(255,255,255,.05);transition:.5s}.tile:hover i{transform:scale(1.15) rotate(-6deg);color:rgba(56,208,255,.12)}
.tile b{font:800 1.8rem 'Outfit',sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.tile span{color:var(--mut);font-size:.92rem}.tile u{text-decoration:none;position:absolute;bottom:26px;inset-inline-end:26px;width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;transition:.4s}.tile:hover u{transform:scale(1.15) rotate(-45deg)}
[dir=rtl] .tile u{transform:scaleX(-1)}[dir=rtl] .tile:hover u{transform:scaleX(-1) scale(1.15) rotate(-45deg)}
.fbar{position:sticky;top:84px;z-index:30;margin-top:24px;padding:14px;border-radius:22px;background:rgba(8,11,20,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line)}
.brands{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}.brands::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:7px 18px;border-radius:999px;cursor:pointer;font-weight:700;transition:.25s}.chip:hover{border-color:var(--g2)}.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 20px -8px var(--g1)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;outline:0;transition:.25s}select option{background:#0a0d18}
input:focus,select:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(56,208,255,.15)}
.mdl{width:auto;min-width:160px;border-radius:999px}.search{max-width:230px;margin-inline-start:auto;border-radius:999px!important}
.cntr{margin-top:10px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;max-width:1280px;margin:auto;padding:22px 5% 40px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:26px;display:flex;flex-direction:column;transform:perspective(1000px) rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .18s,border-color .3s,box-shadow .3s;will-change:transform}
.card.pop{animation:pop .6s cubic-bezier(.2,.7,.2,1) backwards}@keyframes pop{from{opacity:0;translate:0 28px;scale:.95}}
.card:hover{border-color:rgba(56,208,255,.45);box-shadow:var(--sh)}
.img{position:relative;aspect-ratio:1/1;cursor:pointer;background:linear-gradient(135deg,#101628,#0a0d18);display:grid;place-items:center;font-size:4rem;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;transition:.7s cubic-bezier(.2,.7,.2,1)}.card:hover .img img{transform:scale(1.1)}
.img:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(4,5,10,.55),transparent 45%)}
.qv{position:absolute;z-index:2;bottom:12px;inset-inline:12px;text-align:center;padding:8px;border-radius:14px;background:rgba(8,11,20,.8);backdrop-filter:blur(8px);font-weight:700;font-size:.9rem;opacity:0;translate:0 12px;transition:.35s}.card:hover .qv{opacity:1;translate:0 0}
.tag{position:absolute;z-index:2;top:12px;inset-inline-end:12px;padding:4px 13px;border-radius:999px;font-size:.76rem;font-weight:800;color:#fff;backdrop-filter:blur(6px)}
.t-in{background:rgba(34,197,94,.85)}.t-soon{background:rgba(245,158,11,.9)}.t-out{background:rgba(239,68,68,.9)}
.info{padding:16px;display:flex;flex-direction:column;gap:5px;flex:1}.name{font-weight:800;cursor:pointer;line-height:1.35}.bt{font-size:.8rem;color:var(--g2);font-weight:700}
.price{font:800 1.3rem 'Outfit','Cairo',sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.row{display:flex;gap:8px;margin-top:auto;padding-top:10px}.row .btn{flex:1;padding:10px 6px;white-space:nowrap}
.sk{height:380px;border-radius:26px;background:linear-gradient(100deg,rgba(255,255,255,.03) 30%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.03) 70%);background-size:300% 100%;animation:sh 1.4s infinite;border:1px solid var(--line)}@keyframes sh{to{background-position:-300% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 20px;font-size:1.1rem}.empty b{display:block;font-size:3rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:30px}
.step{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;transition:.4s}.step:hover{transform:translateY(-6px);border-color:rgba(56,208,255,.4)}
.step i{font-style:normal;display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--grad);font:800 1.3rem 'Outfit',sans-serif;margin-bottom:14px;box-shadow:var(--sh)}.step p{color:var(--mut);font-size:.95rem}
.faq{display:grid;gap:12px;margin-top:26px;max-width:820px}
details.fq{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 20px;transition:.3s}details.fq[open]{border-color:rgba(56,208,255,.4);background:rgba(56,208,255,.05)}
.fq summary{cursor:pointer;list-style:none;padding:17px 0;font-weight:800;display:flex;justify-content:space-between;gap:10px}.fq summary::-webkit-details-marker{display:none}.fq summary:after{content:"+";font-size:1.4rem;color:var(--g2);transition:.3s}.fq[open] summary:after{transform:rotate(45deg)}.fq p{color:var(--mut);padding-bottom:18px}
.cta{position:relative;overflow:hidden;text-align:center;border-radius:34px;padding:64px 22px;margin:20px 0 40px;background:linear-gradient(135deg,rgba(29,111,255,.35),rgba(124,92,255,.3));border:1px solid rgba(56,208,255,.35)}
.cta:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--g2);filter:blur(120px);opacity:.28;top:-200px;inset-inline-start:-100px;animation:drift 12s ease-in-out infinite alternate}
.cta h2,.cta p,.cta .btn{position:relative}.cta p{color:#cfd8f3;margin:10px 0 26px}.cta .btn{background:#fff;color:#07101f}
footer{border-top:1px solid var(--line);background:rgba(255,255,255,.015);padding:46px 5% 110px;text-align:center;color:var(--mut)}footer a.logo{justify-content:center;color:var(--ink);font-size:1.6rem;margin-bottom:10px}
.ftl{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:16px 0}.ftl a{text-decoration:none;font-weight:700}.ftl a:hover{color:var(--g2)}
.wa{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:20px;z-index:55;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:1.8rem;text-decoration:none;box-shadow:0 10px 30px -8px #25d366}.wa:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:ripple 2s infinite}@keyframes ripple{to{transform:scale(1.7);opacity:0}}
.fc{display:none}
.ov{position:fixed;inset:0;background:rgba(2,3,8,.7);backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:16px;animation:fi .3s}@keyframes fi{from{opacity:0}}
.x{position:absolute;top:14px;inset-inline-end:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;z-index:5;transition:.25s}.x:hover{background:var(--bad);transform:rotate(90deg)}
.vm{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(900px,100%);max-height:92vh;overflow:auto;background:#0a0d18;border:1px solid var(--line);border-radius:30px;animation:up .45s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{opacity:0;translate:0 40px;scale:.97}}
.vimg{position:relative;min-height:340px;height:100%;display:grid;place-items:center;font-size:6rem;background:linear-gradient(135deg,#101628,#080b14);overflow:hidden}.vimg img{width:100%;height:100%;object-fit:cover}
.vr{padding:34px 28px;display:flex;flex-direction:column;gap:10px}.vr h2{font-size:1.7rem;line-height:1.25}.vr .price{font-size:1.9rem}
.gl{color:var(--mut);font-size:.84rem;font-weight:700;margin-top:6px}.pills{display:flex;gap:7px;flex-wrap:wrap;max-height:170px;overflow:auto}
.pill2{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.88rem;transition:.2s}.pill2:hover{border-color:var(--g2)}.pill2.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px -8px var(--g1)}
.qty{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px}.qty button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.07);cursor:pointer;font-size:1.1rem;transition:.2s}.qty button:hover{background:var(--g1)}.qty b{min-width:26px;text-align:center}
.vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.vrow .btn{flex:1}
.dr{place-items:stretch;padding:0;justify-items:end}
.drawer{position:relative;width:min(450px,100%);height:100%;background:#090c16;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;animation:sl .45s cubic-bezier(.2,.7,.2,1);margin-inline-start:auto}
@keyframes sl{from{translate:calc(var(--sd)*100%) 0}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.dh .x{position:static}
.dscroll{overflow:auto;flex:1;padding:18px 22px 26px;display:flex;flex-direction:column;gap:12px}
.ci{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:18px;background:var(--card);animation:pop .4s backwards}
.ci .th{width:62px;height:62px;border-radius:14px;overflow:hidden;background:#101628;display:grid;place-items:center;font-size:1.6rem}.ci .th img{width:100%;height:100%;object-fit:cover}
.ci .rm{background:none;border:0;color:var(--mut);cursor:pointer;font-size:.8rem;margin-top:2px}.ci .rm:hover{color:var(--bad)}
.tot{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px dashed var(--line);font-size:1.1rem}
.pay{display:flex;gap:10px;flex-wrap:wrap}.pay label{display:flex;align-items:center;gap:8px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:11px 14px;flex:1;white-space:nowrap;transition:.2s}.pay label:has(input:checked){border-color:var(--g2);background:rgba(56,208,255,.1)}.pay input{width:auto}

  <div class="fbar"><div class="brands">${[["all",t("all")],...bs].map(b=>`<button class="chip ${brand===b[0]?"on":""}" onclick="setBrand('${b[0]}')">${esc(b[1])}</button>`).join("")}</div>
  <div class="filters">${models.length?`<select class="mdl" onchange="model=this.value;render()"><option value="all">${t("allModels")}</option>${models.map(m=>`<option ${model===m?"selected":""}>${esc(m)}</option>`).join("")}</select>`:""}
  ${[["all",t("allSt")],["in",t("fin")],["soon",t("fsoon")],["out",t("fout")]].map(f=>`<button class="chip ${flt===f[0]?"on":""}" onclick="flt='${f[0]}';render()">${f[1]}</button>`).join("")}
  <select class="mdl" onchange="sort=this.value;render()"><option value="def">${t("sort")}: ${t("sdef")}</option><option value="asc" ${sort==="asc"?"selected":""}>${t("sasc")}</option><option value="desc" ${sort==="desc"?"selected":""}>${t("sdesc")}</option></select>
  <input id="sq" class="search" placeholder="${t("search")}" value="${esc(q)}" oninput="q=this.value;render()"></div><div class="mut cntr">${T[lang].res(vis.length)}</div></div></section>
  <div class="grid">${loaded?(vis.map((p,i)=>card(p,i,pop)).join("")||`<div class="empty"><b>📭</b>${t("nonep")}</div>`):Array(6).fill('<div class="sk"></div>').join("")}</div>
  <section class="sec ${rv}" id="how"><div class="eyebrow">${t("eyeH")}</div><h2>${t("howT")}</h2><div class="steps">${[1,2,3].map(n=>`<div class="step"><i>${n}</i><h3>${t("s"+n)}</h3><p>${t("s"+n+"p")}</p></div>`).join("")}</div></section>
  <section class="sec ${rv}" id="faq"><div class="eyebrow">${t("eyeF")}</div><h2>${t("faqT")}</h2><div class="faq">${[1,2,3,4].map(n=>`<details class="fq"><summary>${t("q"+n)}</summary><p>${t("a"+n+"x")}</p></details>`).join("")}</div></section>
  <section class="sec ${rv}" id="contact"><div class="cta"><h2>${t("ctaT")}</h2><p>${t("ctaP")}</p><a class="btn big" href="${wa}" target="_blank" rel="noopener">💬 ${t("chat")} • <span dir="ltr">01210899342</span></a></div></section>
  <footer><a class="logo lat" href="#" onclick="goHome();return false"><img src="logo.jpg" alt="KVN"><span>KVN Covers</span></a><p>${t("tagline")}</p><div class="ftl"><a href="#shop">${t("shop")}</a><a href="#how">${t("how")}</a><a href="#faq">${t("faq")}</a><a href="${wa}" target="_blank" rel="noopener">WhatsApp</a></div><p>${t("rights")}</p></footer>
  <a class="wa" href="${wa}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>
  ${cnt&&!modal?`<button class="fc" onclick="openCart()"><span>🛒 ${t("viewCart")} (${cnt})</span><b>${money(total())}</b></button>`:""}${modalHTML()}`;
  if(keep){const e=$("#sq");e.focus();e.setSelectionRange(q.length,q.length)}
  post()}
function post(){
  document.body.classList.toggle("lock",!!modal);
  if(!seen){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el));setTimeout(()=>seen=true,2500)}
  if(!animDone&&loaded){const el=$(".stats");if(el){const io2=new IntersectionObserver(es=>{if(es[0].isIntersecting){io2.disconnect();animDone=true;document.querySelectorAll(".num").forEach(n=>{const to=+n.dataset.n,st=performance.now();const step=now=>{const k=Math.min(1,(now-st)/1300);n.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}});io2.observe(el)}}
  if(bump)setTimeout(()=>bump=false,600);spy()}
addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight,pg=$("#pg"),nv=$(".nav");if(pg)pg.style.width=(h>0?scrollY/h*100:0)+"%";if(nv)nv.classList.toggle("sc",scrollY>30);spy()},{passive:true});
function spy(){let cur="top";["top","shop","how","faq","contact"].forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<innerHeight*.4)cur=id});document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("on",a.dataset.s===cur))}
document.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const c=e.target.closest&&e.target.closest(".card,.tile,.step");if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");if(c.classList.contains("card")){c.style.setProperty("--ry",(x-.5)*9+"deg");c.style.setProperty("--rx",(.5-y)*9+"deg")}});
document.addEventListener("pointerout",e=>{const c=e.target.closest&&e.target.closest(".card");if(c&&!c.contains(e.relatedTarget)){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}});
/* ---------- النوافذ ---------- */
function modalHTML(){
  if(!modal)return"";
  if(modal.t==="view"){const p=products.find(x=>x.id===modal.id);if(!p)return"";const s=ST[p.status]||ST.in,can=p.status==="in",ms=pm(p);
    return `<div class="ov" onclick="if(event.target===this)closeModal()"><div class="vm"><button class="x" onclick="closeModal()">✕</button>
    <div class="vimg">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}">`:"📱"}<span class="tag ${s[1]}">${t(s[0])}</span></div>
    <div class="vr"><div class="bt">${esc(brandsTxt(p))}</div><h2>${esc(p.name)}</h2><div class="codeb" onclick="copyCode('${pcode(p)}')">#${pcode(p)} 📋</div>${hasPrice(p)?`<div class="price">${money(p.price)}</div>`:`<div class="pw">${t("priceWa")}</div>`}
    ${ms.length>1?`<div class="gl">${t("pickModel")}</div>`:(ms.length?`<div class="gl">${t("fits")}</div>`:"")}
    ${groups(p).map(g=>`${g[0]&&pb(p).length>1?`<div class="gl">${esc(g[0])}</div>`:""}<div class="pills">${g[1].map(m=>`<button class="pill2 ${vsel===m?"on":""}" data-m="${esc(m)}" onclick="pickM(this.dataset.m)">${esc(m)}</button>`).join("")}</div>`).join("")}
    ${hasPrice(p)?`<div class="gl">${t("qtyL")}</div><div class="qty"><button onclick="vqc(-1)">−</button><b>${vq}</b><button onclick="vqc(1)">+</button></div><div class="vrow"><button class="btn o" ${can?"":"disabled"} onclick="addSel('${p.id}',0)">${t("add")}</button><button class="btn" ${can?"":"disabled"} onclick="addSel('${p.id}',1)">${t("buy")}</button></div>`:`<div class="vrow"><button class="btn big" ${p.status!=="out"?"":"disabled"} onclick="addSel('${p.id}',2)">${t("askPrice")}</button></div>`}</div></div></div>`}
  if(modal.t==="cart"){const it=cartItems();
    return `<div class="ov dr" onclick="if(event.target===this)closeModal()"><aside class="drawer"><div class="dh"><h2>🛒 ${t("cartT")}</h2><button class="x" onclick="closeModal()">✕</button></div><div class="dscroll">
    ${it.length?it.map((x,i)=>`<div class="ci" style="animation-delay:${i*60}ms"><div class="th">${x.p.img?`<img src="${esc(x.p.img)}" alt="">`:"📱"}</div><div><b>${esc(x.p.name)}</b>${x.m?`<div class="bt">${esc(x.m)}</div>`:""}<div class="mut">${money(x.p.price)}</div><button class="rm" onclick="chgI(${i},-999)">🗑 ${t("remove")}</button></div><div class="qty"><button onclick="chgI(${i},-1)">−</button><b>${x.q}</b><button onclick="chgI(${i},1)">+</button></div></div>`).join("")+`<div class="tot"><b>${t("total")}</b><b class="price">${money(total())}</b></div>${checkoutForm()}`
    :`<div class="empty"><b>🛍️</b>${t("empty")}<p class="mut">${t("emptyP")}</p></div>`}
    <button class="btn o" onclick="closeModal()">${t("close")}</button></div></aside></div>`}
  if(modal.t==="ok")return modal.html;
  return""}
function closeModal(){modal=null;render()}
function openView(id){const p=products.find(x=>x.id===id);if(!p)return;const ms=pm(p);vsel=ms.length===1?ms[0]:(model!=="all"&&ms.includes(model)?model:"");vq=1;modal={t:"view",id};render()}
function pickM(m){vsel=m;render()}
function vqc(d){vq=Math.max(1,vq+d);render()}
function matchQ(p){const s=q.trim().toLowerCase();if(!s)return true;const sc=s.replace(/[\s-]/g,"");return (p.name+" "+pm(p).join(" ")+" "+brandsTxt(p)+" "+pcode(p)).toLowerCase().includes(s)||pcode(p).replace(/-/g,"").toLowerCase().includes(sc)}
function askWa(id,m){const p=products.find(x=>x.id===id);if(!p)return;const L=[t("askHi"),"• "+t("askName")+": "+p.name,"• "+t("askCode")+": "+pcode(p)];if(m)L.push("• "+t("askModel")+": "+m);if(brandsTxt(p))L.push("• "+t("askCat")+": "+brandsTxt(p));L.push(t("askLink")+": "+location.href.split("#")[0]);window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(L.join("\n")),"_blank")}
function copyCode(c){try{navigator.clipboard.writeText(c)}catch(e){}toast(t("copied"))}
const ck=(id,m)=>m?id+"|"+m:id;
function quick(id,buy){const p=products.find(x=>x.id===id),ms=pm(p);if(ms.length>1){openView(id)}else{if(buy===2){askWa(id,ms[0]||"")}else{buy?buyNow(id,ms[0]||"",1):add(id,ms[0]||"",1)}}}
function addSel(id,buy){const p=products.find(x=>x.id===id),ms=pm(p),m=ms.length>1?vsel:(ms[0]||"");if(ms.length>1&&!m){toast(t("pickModel"));return}if(buy===2){askWa(id,m);return}buy?buyNow(id,m,vq):add(id,m,vq)}
function add(id,m,n){const k=ck(id,m||"");cart[k]=(cart[k]||0)+(n||1);saveCart();modal=null;bump=true;toast(t("added"));render()}
function buyNow(id,m,n){const k=ck(id,m||"");if(!cart[k])cart[k]=n||1;saveCart();openCart()}
function chg(k,d){cart[k]=(cart[k]||0)+d;if(cart[k]<=0)delete cart[k];saveCart();openCart()}
function chgI(i,d){const x=cartItems()[i];if(x)chg(x.key,d)}
function openCart(){modal={t:"cart"};menu=false;render()}
/* ---------- الشراء ---------- */
function setPay(v){cust.pay=v;$("#payn").textContent=payNote()}
function payNote(){return cust.pay==="instapay"?(INSTAPAY?t("instaTo")+" "+INSTAPAY:t("instaHint")):""}
function checkoutForm(){return `<input id="nm" placeholder="${t("fName")}" autocomplete="name" value="${esc(cust.nm)}" oninput="cust.nm=this.value">
  <input id="ph" type="tel" inputmode="tel" placeholder="${t("fPhone")}" autocomplete="tel" dir="ltr" value="${esc(cust.ph)}" oninput="cust.ph=this.value">
  <div class="mut">${t("payT")}</div><div class="pay"><label><input type="radio" name="pay" ${cust.pay==="cash"?"checked":""} onchange="setPay('cash')"> ${t("cash")}</label><label><input type="radio" name="pay" ${cust.pay==="instapay"?"checked":""} onchange="setPay('instapay')"> ${t("insta")}</label></div>
  <div class="mut" id="payn">${payNote()}</div><button class="btn big" id="cb" onclick="checkout()">${t("checkout")}</button>`}
function normPhone(s){let d=String(s).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,"");if(d.startsWith("20")&&d.length===12)d="0"+d.slice(2);return d}
function confetti(){const c=document.createElement("canvas");c.className="cf";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d"),cols=["#1d6fff","#38d0ff","#7c5cff","#ffffff","#22c55e"],ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight/2.4,vx:(Math.random()-.5)*16,vy:Math.random()*-14-3,s:4+Math.random()*6,c:cols[Math.random()*5|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<130)requestAnimationFrame(a);else c.remove()})()}
async function checkout(){
  const nm=cust.nm.trim(),ph=normPhone(cust.ph),it=cartItems();if(!it.length)return;
  if(nm.length<2){toast(t("errName"));return}
  if(!/^01[0125]\d{8}$/.test(ph)){toast(t("errPhone"));return}
  const cb=$("#cb");if(cb){cb.disabled=true;cb.textContent=t("sending")}
  const code="KVN-"+Math.random().toString(36).slice(2,8).toUpperCase(),tot=total(),pay=cust.pay;
  const items=it.map(x=>({name:x.p.name,model:x.m,qty:x.q,price:x.p.price}));
  let sent=false;
  if(ORDERS_URL){try{await fetch(ORDERS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"create",code,name:nm,phone:ph,payment:pay,items,total:tot})});sent=true}catch(e){}}
  const payS=pay==="cash"?t("cashS"):t("instaS");
  const msg=`${t("hi")} ${nm}\n${t("phoneL")}: ${ph}\n${t("payL")}: ${payS}\n${t("code")}: ${code}\n`+it.map(x=>`• ${x.p.name}${x.m?" ("+x.m+")":""} × ${x.q} = ${money(x.p.price*x.q)}`).join("\n")+`\n${t("total")}: ${money(tot)}`;
  const url=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
  cart={};saveCart();
  modal={t:"ok",html:`<div class="ov okw"><div class="okb"><svg class="ck" viewBox="0 0 52 52"><circle class="c1" cx="26" cy="26" r="24" fill="none" stroke="#22c55e" stroke-width="3"/><path class="c2" d="M14 27l8 8 16-17" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><h2 style="text-align:center">${t("okT")}</h2>
  <div class="okl"><div>✅ ${t("stA")}</div>${ORDERS_URL?(sent?`<div>✅ ${t("stB")}</div>`:`<div class="warn">⚠️ ${t("noStore")}</div>`):""}<div>💬 ${t("stC")}</div></div>
  <div class="ticket"><div class="mut">${t("code")}</div><div class="code lat">${code}</div></div>
  <div class="mut">${t("custI")}</div><div class="item"><span>${esc(nm)}</span><span dir="ltr">${ph}</span></div><div class="item"><span>${t("payL")}</span><b>${payS}</b></div>
  ${pay==="instapay"?`<div class="mut">${payNote()}</div>`:""}
  ${it.map(x=>`<div class="item"><span>${esc(x.p.name)}${x.m?" ("+esc(x.m)+")":""} × ${x.q}</span><b>${money(x.p.price*x.q)}</b></div>`).join("")}
  <div class="item"><b>${t("total")}</b><b class="price">${money(tot)}</b></div>
  <a class="btn big" href="${url}" target="_blank" rel="noopener">💬 ${t("sendWa")}</a><button class="btn o" onclick="closeModal()">${t("done")}</button></div></div>`};
  render();confetti();
  setTimeout(()=>toast(sent||!ORDERS_URL?t("okStore"):t("noStore")),600);setTimeout(()=>toast(t("okNext")),3200)}
render();

</script>
</body>
