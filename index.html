fetch("products.json?t="+Date.now()).then(r=>r.json()).then(d=>{if(Array.isArray(d)){products=d}else{products=d.products||[];cats=d.categories||[]}loaded=true;render()}).catch(()=>{loaded=true;render()});
function setLang(){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("lang",lang)}catch(e){}render()}
function goHome(){flt="all";brand="all";model="all";q="";sort="def";modal=null;render();scrollTo({top:0,behavior:"smooth"})}
function setBrand(b,go){brand=b;model="all";render();if(go)document.getElementById("shop").scrollIntoView({behavior:"smooth"})}
function card(p,i){const s=ST[p.status]||ST.in,can=p.status==="in";
  return `<div class="card" style="animation-delay:${Math.min(i,10)*50}ms"><div class="img" onclick="openView('${p.id}')">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">`:"📱"}<span class="tag ${s[1]}">${t(s[0])}</span></div>
  <div class="info"><div class="name" onclick="openView('${p.id}')">${esc(p.name)}</div><div class="bt">${esc(brandName(bp(p)))}${modelsTxt(p)}</div><div class="price">${money(p.price)}</div>
  <div class="row"><button class="btn o" ${can?"":"disabled"} onclick="quick('${p.id}',0)">${t("add")}</button><button class="btn" ${can?"":"disabled"} onclick="quick('${p.id}',1)">${t("buy")}</button></div></div></div>`}
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=t("title");
  const bs=cats.filter(c=>products.some(p=>bp(p)===c.id)).map(c=>[c.id,c.name]);
  const models=brand==="all"?[]:[...new Set(products.filter(p=>bp(p)===brand).flatMap(pm))];
  let vis=products.filter(p=>(flt==="all"||p.status===flt)&&(brand==="all"||bp(p)===brand)&&(model==="all"||pm(p).includes(model))&&(p.name+" "+pm(p).join(" ")).toLowerCase().includes(q.toLowerCase()));
  if(sort==="asc")vis=[...vis].sort((a,b)=>a.price-b.price);if(sort==="desc")vis=[...vis].sort((a,b)=>b.price-a.price);
  const ann=[t("a1"),t("a2"),t("a3"),t("a4")].map(x=>`<span>${x}</span>`).join("").repeat(6);
  const mq=["KVN Covers","✦","Your style, our cover.","✦"].map(x=>`<span>${x}</span>`).join("").repeat(8);
  const keep=document.activeElement&&document.activeElement.id==="sq";
  const wa=`https://wa.me/${WA}`;
  $("#app").innerHTML=`<div class="ann"><div>${ann}</div></div>
  <div class="nav"><a class="logo lat" href="#" onclick="goHome();return false"><img src="logo.jpg" alt="KVN"><span>KVN Covers</span></a>
  <div class="links"><a href="#" onclick="goHome();return false">${t("home")}</a><a href="#shop">${t("shop")}</a><a href="#how">${t("how")}</a><a href="#contact">${t("contact")}</a></div>
  <div class="acts2"><button class="langb" onclick="setLang()">${lang==="ar"?"EN":"عربي"}</button><button class="btn" onclick="openCart()">🛒 <span class="hm">${t("cart")}</span><span class="cnt">${count()}</span></button></div></div>
  <section class="hero"><div><div class="pill">${t("pill")}</div><h1>${t("h1")}</h1><p>${t("hp")}</p>
  <div class="ctas"><a class="btn" style="text-decoration:none" href="#shop">${t("shopNow")}</a><a class="btn o" style="text-decoration:none" href="${wa}" target="_blank" rel="noopener">${t("chat")}</a></div></div>
  <div class="mock"><img class="heroLogo" src="logo.jpg" alt="KVN Covers"></div></section>
  <div class="strip"><div>${mq}</div></div>
  ${bs.length?`<section class="sec" style="padding-bottom:0"><h2>${t("dev")}</h2><p class="mut">${t("devp")}</p><div class="tiles">${bs.map(b=>`<div class="tile" onclick="setBrand('${b[0]}',1)"><b>${esc(b[1])}</b><span>${T[lang].items(products.filter(p=>bp(p)===b[0]).length)}</span></div>`).join("")}</div></section>`:""}
  <section class="sec" id="shop"><h2>${t("cases")}</h2><p class="mut">${t("casesp")}</p>
  <div class="brands">${[["all",t("all")],...bs].map(b=>`<button class="chip ${brand===b[0]?"on":""}" onclick="setBrand('${b[0]}')">${esc(b[1])}</button>`).join("")}</div>
  <div class="filters">${models.length?`<select class="mdl" onchange="model=this.value;render()"><option value="all">${t("allModels")}</option>${models.map(m=>`<option ${model===m?"selected":""}>${esc(m)}</option>`).join("")}</select>`:""}
  ${[["all",t("allSt")],["in",t("fin")],["soon",t("fsoon")],["out",t("fout")]].map(f=>`<button class="chip ${flt===f[0]?"on":""}" onclick="flt='${f[0]}';render()">${f[1]}</button>`).join("")}
  <select class="mdl" onchange="sort=this.value;render()"><option value="def">${t("sort")}: ${t("sdef")}</option><option value="asc" ${sort==="asc"?"selected":""}>${t("sasc")}</option><option value="desc" ${sort==="desc"?"selected":""}>${t("sdesc")}</option></select>
  <input id="sq" class="search" placeholder="${t("search")}" value="${esc(q)}" oninput="q=this.value;render()"></div>
  <div class="mut cntr">${T[lang].res(vis.length)}</div></section>
  <div class="grid">${vis.map(card).join("")||`<div class="empty">${loaded?t("nonep"):t("load")}</div>`}</div>
  <section class="sec" id="how"><h2>${t("howT")}</h2><div class="steps">${[1,2,3].map(n=>`<div class="step"><i>${n}</i><h3>${t("s"+n)}</h3><p>${t("s"+n+"p")}</p></div>`).join("")}</div></section>
  <section class="sec" id="contact"><div class="cta"><h2>${t("ctaT")}</h2><p>${t("ctaP")}</p><a class="btn big" style="text-decoration:none" href="${wa}" target="_blank" rel="noopener">💬 ${t("chat")} • <span dir="ltr">01210899342</span></a></div></section>
  <footer><a class="logo lat" href="#" onclick="goHome();return false"><img src="logo.jpg" alt="KVN"><span>KVN Covers</span></a><p>${t("tagline")}</p><p style="margin-top:6px">${t("rights")}</p></footer>
  <a class="wa" href="${wa}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>${modal||""}`;
  if(keep){const e=$("#sq");e.focus();e.setSelectionRange(q.length,q.length)}
}
function closeModal(){modal=null;render()}
function openView(id){const p=products.find(x=>x.id===id);if(!p)return;const s=ST[p.status]||ST.in,can=p.status==="in",ms=pm(p);
  modal=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="vimg">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}">`:"📱"}<span class="tag ${s[1]}">${t(s[0])}</span></div>
  <h2>${esc(p.name)}</h2><div class="bt">${esc(brandName(bp(p)))}${modelsTxt(p,1)}</div><div class="price" style="font-size:1.7rem">${money(p.price)}</div>${ms.length>1?`<div class="mut">${t("pickModel")}</div><select id="vm" style="width:100%"><option value="">—</option>${ms.map(m=>`<option ${model===m?"selected":""}>${esc(m)}</option>`).join("")}</select>`:""}
  <div class="row"><button class="btn o" ${can?"":"disabled"} onclick="addSel('${p.id}',0)">${t("add")}</button><button class="btn" ${can?"":"disabled"} onclick="addSel('${p.id}',1)">${t("buy")}</button></div>
  <button class="btn o" onclick="closeModal()">${t("close")}</button></div></div>`;render()}
const ck=(id,m)=>m?id+"|"+m:id;
function quick(id,buy){const p=products.find(x=>x.id===id),ms=pm(p);if(ms.length>1){openView(id)}else{buy?buyNow(id,ms[0]||""):add(id,ms[0]||"")}}
function addSel(id,buy){const p=products.find(x=>x.id===id),ms=pm(p),m=ms.length>1?($("#vm")||{}).value:(ms[0]||"");if(ms.length>1&&!m){toast(t("pickModel"));return}buy?buyNow(id,m):add(id,m)}
function add(id,m){const k=ck(id,m||"");cart[k]=(cart[k]||0)+1;saveCart();modal=null;toast(t("added"));render()}
function buyNow(id,m){const k=ck(id,m||"");if(!cart[k])cart[k]=1;saveCart();modal=null;openCart()}
function chg(k,d){cart[k]=(cart[k]||0)+d;if(cart[k]<=0)delete cart[k];saveCart();openCart()}
function chgI(i,d){const x=cartItems()[i];if(x)chg(x.key,d)}
function openCart(){const it=cartItems();
  modal=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2>${t("cartT")}</h2>
  ${it.length?it.map((x,i)=>`<div class="item"><div>${esc(x.p.name)}${x.m?`<div class="bt">${esc(x.m)}</div>`:""}<div class="mut">${money(x.p.price)}</div></div><div class="q"><button onclick="chgI(${i},1)">+</button><b>${x.q}</b><button onclick="chgI(${i},-1)">−</button></div></div>`).join("")+`<div class="item"><b>${t("total")}</b><b class="price">${money(total())}</b></div>${checkoutForm()}`:`<div class="empty">${t("empty")}</div>`}
  <button class="btn o" onclick="closeModal()">${t("close")}</button></div></div>`;render()}
function setPay(v){cust.pay=v;$("#payn").textContent=payNote()}
function payNote(){return cust.pay==="instapay"?(INSTAPAY?t("instaTo")+" "+INSTAPAY:t("instaHint")):""}
function checkoutForm(){return `<input id="nm" placeholder="${t("fName")}" autocomplete="name" value="${esc(cust.nm)}" oninput="cust.nm=this.value">
  <input id="ph" type="tel" inputmode="tel" placeholder="${t("fPhone")}" autocomplete="tel" dir="ltr" value="${esc(cust.ph)}" oninput="cust.ph=this.value">
  <div class="mut">${t("payT")}</div><div class="pay"><label><input type="radio" name="pay" ${cust.pay==="cash"?"checked":""} onchange="setPay('cash')"> ${t("cash")}</label><label><input type="radio" name="pay" ${cust.pay==="instapay"?"checked":""} onchange="setPay('instapay')"> ${t("insta")}</label></div>
  <div class="mut" id="payn">${payNote()}</div><button class="btn" id="cb" onclick="checkout()">${t("checkout")}</button>`}
function normPhone(s){let d=String(s).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,"");if(d.startsWith("20")&&d.length===12)d="0"+d.slice(2);return d}
async function checkout(){
  const nm=cust.nm.trim(),ph=normPhone(cust.ph),it=cartItems();if(!it.length)return;
  if(nm.length<2){toast(t("errName"));return}
  if(!/^01[0125]\d{8}$/.test(ph)){toast(t("errPhone"));return}
  const cb=$("#cb");if(cb){cb.disabled=true;cb.textContent=t("sending")}
  const code="KVN-"+Math.random().toString(36).slice(2,8).toUpperCase(),tot=total(),pay=cust.pay;
  const items=it.map(x=>({name:x.p.name,model:x.m,qty:x.q,price:x.p.price}));
  let sent=false;
  if(ORDERS_URL){try{await fetch(ORDERS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"create",code,name:nm,phone:ph,payment:pay,items,total:tot})});sent=true}catch(e){}}
  const payS=pay==="cash"?t("cashS"):t("instaS");
  const msg=`${t("hi")} ${nm}\n${t("phoneL")}: ${ph}\n${t("payL")}: ${payS}\n${t("code")}: ${code}\n`+it.map(x=>`• ${x.p.name}${x.m?" ("+x.m+")":""} × ${x.q} = ${money(x.p.price*x.q)}`).join("\n")+`\n${t("total")}: ${money(tot)}`;
  const url=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
  cart={};saveCart();
  modal=`<div class="ov"><div class="sheet"><h2>${t("okT")}</h2>
  <div class="okl"><div>✅ ${t("stA")}</div>${ORDERS_URL?(sent?`<div>✅ ${t("stB")}</div>`:`<div class="warn">⚠️ ${t("noStore")}</div>`):""}<div>💬 ${t("stC")}</div></div>
  <div class="ticket"><div class="mut">${t("code")}</div><div class="code lat">${code}</div></div>
  <div class="mut">${t("custI")}</div>
  <div class="item"><span>${esc(nm)}</span><span dir="ltr">${ph}</span></div><div class="item"><span>${t("payL")}</span><b>${payS}</b></div>
  ${pay==="instapay"?`<div class="mut">${payNote()}</div>`:""}
  ${it.map(x=>`<div class="item"><span>${esc(x.p.name)}${x.m?" ("+esc(x.m)+")":""} × ${x.q}</span><b>${money(x.p.price*x.q)}</b></div>`).join("")}
  <div class="item"><b>${t("total")}</b><b class="price">${money(tot)}</b></div>
  <a class="btn big" style="text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">💬 ${t("sendWa")}</a><button class="btn o" onclick="closeModal()">${t("done")}</button></div></div>`;
  render();
  setTimeout(()=>toast(sent||!ORDERS_URL?t("okStore"):t("noStore")),500);setTimeout(()=>toast(t("okNext")),3000)}

render();

</script>
</body>
</html>
