<style>
:root{--bg:#05060b;--bg2:#0b0e17;--card:#0d111b;--ink:#f1f5ff;--mut:#8f9ab3;--line:#1b2236;--g1:#1d6fff;--g2:#7fd4ff;--grad:linear-gradient(135deg,var(--g1),var(--g2));--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif;line-height:1.55}
button,input,select{font-family:inherit;font-size:.95rem;color:inherit}
input,select{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:0}input:focus,select:focus{border-color:var(--g1)}
.lat{font-family:'Outfit',sans-serif}.mut{color:var(--mut);font-size:.88rem}
.btn{background:var(--grad);color:#fff;border:0;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:700;transition:.2s}.btn:hover{opacity:.88}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.o{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.o:hover{border-color:var(--g1)}.btn.sm{padding:6px 12px;font-size:.82rem}.btn.g{background:var(--ok)}.btn.r{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.lbox{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;display:flex;flex-direction:column;gap:12px;text-align:center}.lbox img{width:90px;height:90px;border-radius:50%;margin:auto}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--card);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-weight:800;font-size:1.15rem}.brand img{width:40px;height:40px;border-radius:50%}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:none;border:0;cursor:pointer;color:var(--mut);font-weight:600;text-align:start;width:100%;transition:.2s}.nv:hover{background:var(--bg2);color:var(--ink)}.nv.on{background:var(--grad);color:#fff}.nv .bdg{margin-inline-start:auto}
.bdg{background:var(--bad);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.75rem;font-weight:800;padding:0 6px}.bdg:empty,.bdg[data-n="0"]{display:none}
.sp{flex:1}
main{padding:26px 30px 120px;max-width:1150px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}.top h1{font-size:1.7rem;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.st b{display:block;font-size:1.9rem;font-weight:900}.st.hot{border-color:var(--g1);box-shadow:0 0 30px -10px var(--g1)}.st small{color:var(--mut)}
.pn{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px}.pn h3{margin-bottom:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tb{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600}.tb.on{background:var(--grad);border-color:transparent;color:#fff}
.b{display:inline-block;padding:2px 12px;border-radius:999px;font-size:.78rem;font-weight:800}.b-new{background:rgba(29,111,255,.2);color:#6aa6ff}.b-conf{background:rgba(245,158,11,.18);color:var(--warn)}.b-done{background:rgba(34,197,94,.18);color:var(--ok)}.b-can{background:rgba(143,154,179,.18);color:var(--mut)}
.oc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}.oc.isnew{border-color:var(--g1);box-shadow:0 0 30px -12px var(--g1)}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.og{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.oi{background:var(--bg2);border-radius:14px;padding:10px 14px;margin-bottom:12px}.oi div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.of{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tot{font-size:1.25rem}.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.acts select{width:auto}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pl 1.2s infinite;margin-inline-start:6px}@keyframes pl{50%{opacity:.25;transform:scale(1.5)}}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tool input{flex:1;min-width:160px}.tool select{width:auto}
.pr{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}.pr .im{width:60px;height:60px;border-radius:12px;background:var(--bg2);object-fit:cover;display:grid;place-items:center;font-size:1.6rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}.mc{display:inline-flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.88rem}.mc a{cursor:pointer;color:var(--bad);font-weight:800}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px}.sheet{background:var(--card);border:1px solid var(--line);border-radius:24px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:11px}
.save{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:min(560px,92vw);background:var(--card);border:1px solid var(--g1);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:40;box-shadow:0 10px 40px -10px var(--g1)}
.toast{position:fixed;top:18px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:var(--card);border:1px solid var(--g1);border-radius:14px;padding:12px 20px;z-index:90;font-weight:700;box-shadow:0 10px 40px -10px var(--g1)}
.empty{text-align:center;color:var(--mut);padding:36px}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:fixed;top:auto;bottom:0;inset-inline:0;height:auto;flex-direction:row;padding:8px;z-index:45;border-inline-end:0;border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}.brand,.sp,.side .hm{display:none}.nv{flex-direction:column;gap:2px;padding:6px 4px;font-size:.72rem;text-align:center;justify-content:center;position:relative}.nv .bdg{position:absolute;top:0;inset-inline-end:6px;margin:0}main{padding:18px 14px 150px}.save{bottom:84px}.pr{grid-template-columns:52px 1fr}.pr .acts{grid-column:1/-1}}
.mchk{display:flex;flex-wrap:wrap;gap:8px;max-height:260px;overflow:auto}.mk{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}.mk input{width:auto}.chips{max-height:230px;overflow:auto}.gh{width:100%;font-weight:800;color:var(--g2);margin-top:6px}</style>
</head>

/* ---------- حفظ ---------- */
async function save(){
  toast("جاري الحفظ...");
  try{for(const p of products){if(p.imgData){const path="images/"+p.id+"-"+Date.now()+".jpg";const r=await gh(path,{method:"PUT",body:JSON.stringify({message:"add image",content:p.imgData.split(",")[1],branch:BR})});if(!r.ok)throw 0;p.img=path;delete p.imgData}}
    const r=await gh("products.json",{method:"PUT",body:JSON.stringify({message:"update store",content:b64(JSON.stringify({categories:cats,products},null,2)),sha,branch:BR})});
    if(!r.ok)throw 0;sha=(await r.json()).content.sha;dirty=false;toast("تم الحفظ ✅ هيظهر على الموقع بعد دقيقة تقريبًا");render()}catch(e){toast("فشل الحفظ. جرّب تاني أو راجع صلاحيات التوكن")}}
async function discard(){if(!confirm("تجاهل كل التغييرات اللي مش محفوظة؟"))return;await load();render()}
/* ---------- العرض ---------- */
function go(v){view=v;pm=false;render();scrollTo(0,0)}
function render(){
  const ae=document.activeElement,aid=ae&&ae.id,pos=ae&&ae.selectionStart;
  if(!ready){$("#app").innerHTML=`<div class="login"><div class="lbox"><img src="logo.jpg" alt=""><h2>لوحة إدارة KVN Covers</h2><p class="mut">سجّل دخولك لإدارة المتجر والطلبات</p>
  <input id="tk" type="password" placeholder="GitHub Token (github_pat_...)" value="${esc(tok)}" autocomplete="off"><input id="ok" type="password" placeholder="كلمة سر الطلبات" value="${esc(okey)}" autocomplete="off">
  <label class="mut" style="display:flex;gap:8px;align-items:center;justify-content:center"><input type="checkbox" id="rem" style="width:auto"> تذكرني على الجهاز ده (مش مناسب لجهاز مش بتاعك)</label><button class="btn" id="lb" onclick="login()">دخول</button><p class="mut">لو ما علّمتش "تذكرني"، الدخول بيتمسح أول ما تقفل التبويب.</p></div></div>`;return}
  const nn=newCount();
  const nav=[["dash","📊","الرئيسية"],["orders","🛍️","الطلبات"],["products","📦","المنتجات"],["cats","🗂️","الأقسام"]].map(n=>`<button class="nv ${view===n[0]?"on":""}" onclick="go('${n[0]}')"><span>${n[1]}</span><span>${n[2]}</span>${n[0]==="orders"?`<span class="bdg" data-o="1" data-n="${nn}">${nn}</span>`:""}</button>`).join("");
  let body="",title="";
  if(view==="dash"){title="نظرة عامة";
    const done=orders.filter(o=>o.status==="done"),pend=orders.filter(o=>o.status==="new"||o.status==="confirmed"),sum=a=>a.reduce((s,o)=>s+(+o.total||0),0);
    body=`<div class="stats"><div class="st ${nn?"hot":""}"><small>طلبات جديدة</small><b>${nn}</b></div><div class="st"><small>إجمالي الطلبات</small><b>${orders.length}</b></div><div class="st"><small>مبيعات مكتملة</small><b>${sum(done)} <small>ج.م</small></b></div><div class="st"><small>طلبات منتظرة</small><b>${sum(pend)} <small>ج.م</small></b></div></div>
    <div class="stats"><div class="st"><small>إجمالي المنتجات</small><b>${products.length}</b></div><div class="st"><small>متوفر</small><b style="color:var(--ok)">${products.filter(p=>p.status==="in").length}</b></div><div class="st"><small>قريبًا</small><b style="color:var(--warn)">${products.filter(p=>p.status==="soon").length}</b></div><div class="st"><small>المخزون خلص</small><b style="color:var(--bad)">${products.filter(p=>p.status==="out").length}</b></div></div>
    ${ordersOk?`<div class="pn"><h3>آخر الطلبات</h3>${orders.slice(0,4).map(orderCard).join("")||'<div class="empty">لا توجد طلبات بعد</div>'}${orders.length>4?`<button class="btn o" onclick="go('orders')">عرض كل الطلبات</button>`:""}</div>`:ordersHint()}`}
  if(view==="orders"){title="الطلبات";
    const L=[["all","الكل"],["new","جديد"],["confirmed","تم التأكيد"],["done","تم التسليم"],["cancelled","ملغي"]];
    const list=orders.filter(o=>(of==="all"||o.status===of)&&(o.name+o.phone+o.code).toLowerCase().includes(oq.toLowerCase()));
    body=ordersOk?`<div class="tabs">${L.map(l=>`<button class="tb ${of===l[0]?"on":""}" onclick="of='${l[0]}';render()">${l[1]}${l[0]!=="all"?` (${orders.filter(o=>o.status===l[0]).length})`:""}</button>`).join("")}</div>
    <div class="tool"><input id="oq" placeholder="🔍 ابحث بالاسم أو الموبايل أو الكود" value="${esc(oq)}" oninput="oq=this.value;render()"><button class="btn o" onclick="loadOrders();toast('تم التحديث')">🔄 تحديث</button><button class="btn o" onclick="Notification.requestPermission().then(p=>toast(p==='granted'?'تم تفعيل الإشعارات 🔔':'الإشعارات متقفلة'))">🔔 إشعارات المتصفح</button></div>
    ${list.map(orderCard).join("")||'<div class="empty">لا توجد طلبات هنا</div>'}`:ordersHint()}
  if(view==="products"){title="المنتجات";
    const list=products.filter(p=>(pc==="all"||pbr(p).includes(pc))&&(p.name+" "+pmod(p).join(" ")+" "+(p.code||"")+" "+(p.code||"").replace("-","")).toLowerCase().includes(pq.trim().toLowerCase()));
    body=`<div class="tool"><input id="pq" placeholder="🔍 ابحث بالاسم أو الكود" value="${esc(pq)}" oninput="pq=this.value;render()"><select onchange="pc=this.value;render()"><option value="all">كل الأقسام</option>${cats.map(c=>`<option value="${c.id}" ${pc===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select><button class="btn" onclick="openP()">+ إضافة جراب</button></div>
    ${list.map(p=>`<div class="pr">${p.img||p.imgData?`<img class="im" src="${p.imgData||"./"+p.img}" alt="">`:'<div class="im">📱</div>'}<div><b>${esc(p.name)}</b> <span class="mut lat">#${esc(p.code||"")}</span><div class="mut">${esc(pbr(p).map(b=>(catOf(b)||{name:"؟"}).name).join(" + ")||"بدون قسم")}${pmod(p).length?" • "+esc(pmod(p).join(" / ")):""} — ${p.price>0?p.price+" ج.م":"السعر على واتساب"}</div></div>
    <div class="acts"><select onchange="setSt('${p.id}',this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===p.status?"selected":""}>${v}</option>`).join("")}</select><button class="btn o sm" onclick="openP('${p.id}')">تعديل</button><button class="btn o sm" onclick="dupP('${p.id}')">📋 نسخ</button><button class="btn r sm" onclick="del('${p.id}')">حذف</button></div></div>`).join("")||'<div class="empty">لا توجد منتجات</div>'}`}
  if(view==="cats"){title="الأقسام والموديلات";
    body=`<div class="pn"><b>📥 الموديلات الجاهزة</b><p class="mut" style="margin:6px 0 10px">بيضيف الأقسام وكل موديلاتها (حديثة وقديمة): iPhone وSamsung وOppo وHuawei وHonor وVivo وXiaomi وRedmi وInfinix، من غير ما يمسح اللي عندك.</p><button class="btn" onclick="importPreset()">استيراد كل الموديلات</button></div><p class="mut" style="margin-bottom:14px">إنت اللي بتحدد كل قسم فيه أنهي موديلات. اكتب أكتر من موديل بفاصلة بينهم.</p><div class="cg">${cats.map(c=>`<div class="cat"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(c.name)}</b><button class="btn r sm" onclick="delCat('${c.id}')">حذف القسم</button></div>
    <div class="chips">${c.models.map((m,i)=>`<span class="mc">${esc(m)} <a onclick="delModel('${c.id}',${i})">×</a></span>`).join("")||'<span class="mut">لا توجد موديلات</span>'}</div>
    <div class="acts"><input id="nm_${c.id}" placeholder="موديل جديد" style="flex:1"><button class="btn sm" onclick="addModel('${c.id}')">+ إضافة</button></div></div>`).join("")}
    <div class="cat"><b>+ قسم جديد</b><div class="acts"><input id="ncat" placeholder="مثلًا Xiaomi" style="flex:1"><button class="btn sm" onclick="addCat()">إضافة</button></div></div></div>`}
  $("#app").innerHTML=`<div class="shell"><aside class="side"><div class="brand"><img src="logo.jpg" alt=""><span class="lat">KVN Admin</span></div>${nav}<div class="sp"></div>
  <a class="nv hm" style="text-decoration:none" href="index.html" target="_blank"><span>🌐</span><span>عرض الموقع</span></a><button class="nv hm" onclick="logout()"><span>🚪</span><span>خروج</span></button></aside>
  <main><div class="top"><h1>${title}</h1><div class="acts"><a class="btn o sm" style="text-decoration:none" href="index.html" target="_blank">🌐 الموقع</a><button class="btn o sm" onclick="logout()">خروج</button></div></div>${body}</main></div>
  ${dirty?`<div class="save"><span>⚠️ عندك تغييرات غير محفوظة</span><div class="acts"><button class="btn o sm" onclick="discard()">تجاهل</button><button class="btn sm" onclick="save()">💾 حفظ ونشر</button></div></div>`:""}${pm?pform():""}`;
  if(aid&&!pm){const n=$("#"+aid);if(n&&n.tagName==="INPUT"){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
}
(async()=>{if(tok&&await load()){await loadOrders();timer=setInterval(loadOrders,20000)}render()})();
</script>
</body>
</html>
